# Scope the CodeQL analysis to httrack-android's OWN code: the Java app and the
# JNI glue. The vendored httrack engine, coucal and libiconv are scanned by their
# own repos, so scanning them here only duplicates findings and build time.
name: httrack-android CodeQL config

# `paths` reaches java-kotlin only, because that leg runs build-mode: none. GitHub
# honours a path filter for a compiled language only when it does not build the
# code, so the build steps in codeql.yml are what scope c-cpp, and the JNI entries
# below only record the same intent. A paths-ignore for the engine lived here and
# excluded nothing.
paths:
  - app/src/main/java
  - app/src/main/jni/htslibjni.c
  - app/src/main/jni/htslibjni.h
  - app/src/main/jni/htslibjni-private.h
  - app/src/main/jni/coffeecatch
